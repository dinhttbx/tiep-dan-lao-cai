        function removeVietnameseTones(str) {
            if (!str) return '';
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            str = str.replace(/[^a-zA-Z0-9]/g, "");
            return str.toLowerCase();
        }

                e.preventDefault();
                setLoginError('');
                const u = removeVietnameseTones(loginForm.username.trim());
                const p = loginForm.password;
                const foundUser = usersList.find(usr => usr.username === u);

                if (foundUser) {

                        if (foundUser.role === 'CAP_XA') {

                        } else {

                        }

                    }
                }
                setLoginError('Tên tài khoản không tồn tại trên hệ thống!');
            };

                setCurrentUser(null);
                sessionStorage.removeItem(STORAGE_KEYS.session);

                e.preventDefault();

                }

                let assignedXa = newAccForm.role === 'CAP_XA' ? newAccForm.xaName : null;

                    username: newU,
                    pass: (newAccForm.password || '12345678*@Ab').trim(),

                    xaName: assignedXa

                setEditingAccount({ ...usr });

                if (!editingAccount) return;
                const updated = { ...editingAccount, xaName: editingAccount.role === 'CAP_XA' ? editingAccount.xaName : null };

                }

                                        <select 
                                            value={processForm.buocXuLy}
                                            onChange={(e) => {
                                                const b = parseInt(e.target.value);
                                                let autoPercent = b * 20;
                                                setProcessForm({ ...processForm, buocXuLy: b, tienDo: autoPercent });
                                            }}
                                            className="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 font-medium"
                                        >
                                            {BUOC_XU_LY.map(b => (
                                                <option key={b.step} value={b.step}>{b.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="text-xs font-semibold text-slate-600">Mức độ hoàn thành (%)</label>
                                            <span className="text-xs font-bold text-indigo-600">{processForm.tienDo}%</span>
                                        </div>
                                        <input 
                                            type="range" min="0" max="100" step="5"
                                            value={processForm.tienDo}
                                            onChange={(e) => setProcessForm({ ...processForm, tienDo: parseInt(e.target.value) })}
                                            className="w-full accent-indigo-600 cursor-pointer"
                                        />
                                    </div>

                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                                        <label className="block text-xs font-bold text-slate-700">Thông tin Văn bản Chỉ đạo / Kết luận</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">Số VB Chỉ đạo / Kết luận</label>
                                                <input 
                                                    type="text" placeholder="Ví dụ: 123/KL-UBND"
                                                    value={processForm.soVanBan}
                                                    onChange={(e) => setProcessForm({ ...processForm, soVanBan: e.target.value })}
                                                    className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">Ngày ban hành Kết luận</label>
                                                <input 
                                                    type="date"
                                                    value={processForm.ngayKetLuan}
                                                    onChange={(e) => setProcessForm({ ...processForm, ngayKetLuan: e.target.value })}
                                                    className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white outline-none"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-semibold text-slate-600 mb-1">Đính kèm tệp PDF / Word của VB Chỉ đạo / Kết luận</label>
                                            <input 
                                                type="file" accept=".doc,.docx,.pdf"
                                                onChange={(e) => handleGenericFileChange(e, 'fileSoVanBan', setProcessForm)}
                                                className="w-full p-1 text-xs border border-slate-300 rounded-lg bg-white file:mr-2 file:py-0.5 file:px-2 file:rounded file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
                                            />
                                            {processForm.fileSoVanBan && (
                                                <p className="text-[11px] text-emerald-600 mt-1 font-medium">✓ Đã đính kèm: <strong>{processForm.fileSoVanBan}</strong></p>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đơn vị / Cơ quan thụ lý chính</label>
                                        <input 
                                            type="text" required
                                            value={processForm.donViGiaiQuet}
                                            onChange={(e) => setProcessForm({ ...processForm, donViGiaiQuet: e.target.value })}
                                            className="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none"
                                        />
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                                        <button 
                                            type="button" onClick={() => setShowProcessModal(false)}
                                            className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition"
                                        >
                                            Hủy bỏ
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition"
                                        >
                                            Lưu Tiến độ & Cập nhật
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL THAY ĐỔI MẬT KHẨU */}
                    {showChangePassModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
                                <h3 className="font-bold text-slate-800 text-lg mb-1">Đổi Mật Khẩu</h3>
                                <p className="text-xs text-slate-500 mb-4">Tài khoản: <strong>{currentUser.name}</strong></p>

                                {passMsg.text && (
                                    <div className={`p-2.5 rounded-lg text-xs font-medium mb-3 text-center ${
                                        passMsg.type === 'error' ? 'bg-rose-100 text-rose-700 border border-rose-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'
                                    }`}>
                                        {passMsg.text}
                                    </div>
                                )}

                                <form onSubmit={handleChangePassword} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Mật khẩu hiện tại</label>
                                        <input type="password" required value={passForm.oldPass} onChange={(e) => setPassForm({ ...passForm, oldPass: e.target.value })} className="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Mật khẩu mới</label>
                                        <input type="password" required value={passForm.newPass} onChange={(e) => setPassForm({ ...passForm, newPass: e.target.value })} className="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Xác nhận mật khẩu mới</label>
                                        <input type="password" required value={passForm.confirmPass} onChange={(e) => setPassForm({ ...passForm, confirmPass: e.target.value })} className="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-3">
                                        <button type="button" onClick={() => { setShowChangePassModal(false); setPassMsg({type:'', text:''}); }} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition">Hủy bỏ</button>
                                        <button type="submit" className="px-4 py-2 bg-red-700 hover:bg-red-800 text-white text-xs font-semibold rounded-lg transition">Cập nhật mật khẩu</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
