        function removeVietnameseTones(str) {
            if (!str) return '';
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            str = str.replace(/[^a-zA-Z0-9]/g, "");
            return str.toLowerCase();
        }

                e.preventDefault();

                        setCurrentUser(foundUser);

                            setFormTiepDan(prev => ({ ...prev, xa: foundUser.xaName }));

                        } else {

                        }

                setLoginError('Tên tài khoản không tồn tại trên hệ thống!');

                setCurrentUser(null);

                e.preventDefault();
                const newU = removeVietnameseTones(newAccForm.username.trim());

                if (!newU) return;
                if (usersList.some(u => u.username === newU)) {
                    alert('Tên tài khoản này đã tồn tại!');
                    return;
                }

                let assignedXa = newAccForm.role === 'CAP_XA' ? newAccForm.xaName : null;
                const newUserObj = {
                    username: newU,
                    pass: (newAccForm.password || '12345678*@Ab').trim(),
                    role: newAccForm.role,
                    name: nameDisplay,
                    xaName: assignedXa

                setUsersList(prev => [...prev, newUserObj]);

                if (!editingAccount) return;
                const updated = { ...editingAccount, xaName: editingAccount.role === 'CAP_XA' ? editingAccount.xaName : null };

                setPassMsg({ type: '', text: '' });

                if (passForm.newPass !== passForm.confirmPass) {

                    return;

                setUsersList(prev => prev.map(u => u.username === currentUser.username ? { ...u, pass: passForm.newPass } : u));

                    setShowChangePassModal(false);
                    setPassForm({ oldPass: '', newPass: '', confirmPass: '' });

                                        <label className="block text-xs font-bold text-slate-700 mb-1">Tiến độ hoàn thành (%)</label>
                                        <div className="flex items-center space-x-3">
                                            <input type="range" min="0" max="100" step="5" value={processForm.tienDo} onChange={(e) => setProcessForm({...processForm, tienDo: parseInt(e.target.value)})} className="flex-1 accent-red-700" />
                                            <span className="font-extrabold text-red-900 text-sm w-12 text-right">{processForm.tienDo}%</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Số Văn bản / Kết luận</label>
                                            <input type="text" placeholder="VD: 45/KL-ĐU..." value={processForm.soVanBan} onChange={(e) => setProcessForm({...processForm, soVanBan: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Ngày ban hành Kết luận</label>
                                            <input type="date" value={processForm.ngayKetLuan} onChange={(e) => setProcessForm({...processForm, ngayKetLuan: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Đơn vị khối Đảng trực tiếp giải quyết</label>
                                        <input type="text" value={processForm.donViGiaiQuet} onChange={(e) => setProcessForm({...processForm, donViGiaiQuet: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Trạng thái xử lý chung</label>
                                        <select value={processForm.trangThai} onChange={(e) => setProcessForm({...processForm, trangThai: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold">
                                            <option value="DangXuLy">Đang trong thời hạn xử lý</option>
                                            <option value="DaGiaiQuet">Đã giải quyết xong (100%)</option>
                                            <option value="QuaHan">Quá thời hạn quy định</option>
                                        </select>
                                    </div>

                                    <div className="flex gap-2 pt-3 border-t border-slate-100">
                                        <button type="submit" className="flex-1 bg-red-800 hover:bg-red-950 text-yellow-300 font-bold py-2.5 rounded-lg text-xs uppercase border border-yellow-500/50">Lưu Tiến Trình</button>
                                        <button type="button" onClick={() => setShowProcessModal(false)} className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg text-xs">Đóng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL PHÁT HÀNH CÔNG VĂN ĐÔN ĐỔC (DÀNH CHO ADMIN / TỈNH ỦY) */}
                    {showDonDocModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 border-4 border-yellow-500 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-extrabold text-red-900 uppercase mb-1">Phát Hành Công Văn Đôn Đốc Khối Đảng</h3>
                                <p className="text-xs text-slate-600 mb-4 font-medium">Gửi công văn đôn đốc đến <strong>{Object.keys(danhSachXaQuaHanDetails).length}</strong> Đảng ủy xã/phường đang có vụ việc quá hạn.</p>

                                <form onSubmit={handleSendDonDoc} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Số Công văn đôn đốc</label>
                                            <input type="text" required value={formDonDoc.soVanBan} onChange={(e) => setFormDonDoc({...formDonDoc, soVanBan: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono font-bold text-red-900" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Ngày ban hành</label>
                                            <input type="date" required value={formDonDoc.ngayBanHanh} onChange={(e) => setFormDonDoc({...formDonDoc, ngayBanHanh: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Trích yếu nội dung công văn</label>
                                        <input type="text" required value={formDonDoc.trichYeu} onChange={(e) => setFormDonDoc({...formDonDoc, trichYeu: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Hạn báo cáo kết quả về Tỉnh ủy</label>
                                        <input type="date" required value={formDonDoc.hanBaoCao} onChange={(e) => setFormDonDoc({...formDonDoc, hanBaoCao: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Yêu cầu chỉ đạo cụ thể</label>
                                        <textarea rows="3" required value={formDonDoc.yCau} onChange={(e) => setFormDonDoc({...formDonDoc, yCau: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-medium"></textarea>
                                    </div>

                                    <div className="bg-rose-50 p-3 rounded-lg border border-rose-200 text-xs">
                                        <p className="font-bold text-rose-900 mb-1">Danh sách các Đảng ủy xã/phường sẽ nhận công văn đôn đốc:</p>
                                        <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
                                            {Object.keys(danhSachXaQuaHanDetails).map(x => (
                                                <span key={x} className="bg-rose-100 text-rose-900 font-bold px-2 py-0.5 rounded text-[10px] border border-rose-300">
                                                    {x} ({danhSachXaQuaHanDetails[x].length} vụ quá hạn)
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-3 border-t border-slate-100">
                                        <button type="submit" className="flex-1 bg-red-800 hover:bg-red-950 text-yellow-300 font-bold py-2.5 rounded-lg text-xs uppercase border border-yellow-500/50 shadow">Phát Hành & Gửi Tự Động</button>
                                        <button type="button" onClick={() => setShowDonDocModal(false)} className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg text-xs">Hủy</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
